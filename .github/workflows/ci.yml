name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dynamic-file-tree:
    name: Dynamic File Tree
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dynamic-file-tree
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: plugins/dynamic-file-tree/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck
